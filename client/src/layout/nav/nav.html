<nav class="navbar bg-base-100 shadow-lg border-b border-base-300 px-6 py-2">
  <div class="flex-1 flex items-center gap-6">
    <div class="flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8 text-pink-400">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
      </svg>
      <a class="text-2xl font-bold bg-gradient-to-r from-pink-400 to-rose-400 bg-clip-text text-transparent">DatingApp</a>
    </div>
    <div class="flex-none hidden md:flex gap-2">
      <a class="btn btn-ghost btn-sm rounded-full text-base-content hover:text-pink-400 hover:bg-pink-400/10">Matches</a>
      <a class="btn btn-ghost btn-sm rounded-full text-base-content hover:text-pink-400 hover:bg-pink-400/10">Lists</a>
      <a class="btn btn-ghost btn-sm rounded-full text-base-content hover:text-pink-400 hover:bg-pink-400/10">Messages</a>
    </div>
  </div>
  @if (accountService.currentUser(); as user) {
    <div class="flex-none flex items-center gap-2">
      <span class="text-sm bg-gradient-to-r from-pink-400 to-rose-400 bg-clip-text text-transparent">Welcome, {{ user.displayName }}</span>
      <button
        (click)="logout()"
        class="btn btn-sm btn-ghost rounded-full text-bbase-content hover:text-pink-400 hover:bg-pink-400/10">
        Logout
      </button>
    </div>
  } @else {
    <form #loginForm="ngForm" (ngSubmit)="login()" class="flex-none flex items-center gap-2">
      <input
        [(ngModel)]="creds.email"
        name="email"
        type="email"
        placeholder="Email"
        class="input input-sm input-bordered bg-base-200 w-32 md:w-auto" />
      <input
        [(ngModel)]="creds.password"
        name="password"
        type="password"
        placeholder="Password"
        class="input input-sm input-bordered bg-base-200 w-32 md:w-auto" />
      <button type="submit" class="btn btn-sm btn-primary bg-gradient-to-r from-pink-400 to-rose-400 border-0 text-white hover:from-pink-500 hover:to-rose-500">Login</button>
    </form>
  }
</nav>
