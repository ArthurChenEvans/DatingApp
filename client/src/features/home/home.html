<div class="hero min-h-screen bg-base-200">
  <div class="hero-content text-center">
    @if (!registerMode()) {
      <div class="max-w-md">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-24 h-24 mx-auto text-primary">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>

        <h1 class="text-5xl font-bold text-primary">Find Your Match</h1>
        <p class="py-6 text-gray-600">Join our community and start your journey to find meaningful connections today.</p>

        <div class="flex gap-4 justify-center">
          <button
            (click)="showRegister(true)"
            class="btn btn-primary bg-gradient-to-r from-pink-400 to-rose-400 border-0 text-white hover:from-pink-500 hover:to-rose-500">
            Register
          </button>
          <button class="btn btn-outline btn-primary">Learn More</button>
        </div>
      </div>
    } @else {
      <app-register
        (cancelRegister)="showRegister($event)"/>
    }
  </div>
</div>
