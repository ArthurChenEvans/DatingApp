<div class="container mx-auto p-8">
  <h2 class="text-3xl font-bold text-primary mb-8">Members</h2>

  @if (members$ | async; as members) {
    @if (members.length === 0) {
      <div class="text-center py-12">
        <p class="text-gray-500 text-lg">No members found</p>
      </div>
    } @else {
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        @for (member of members$ | async; track member.id) {
          <app-member-card [member]="member" />
        }
      </div>
    }
  } @else {
    <div class="flex justify-center py-12">
      <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
  }
</div>
