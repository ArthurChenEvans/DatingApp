<div class="hero min-h-screen bg-base-200">
  <div class="hero-content text-center">
    <div class="max-w-md">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-24 h-24 mx-auto text-warning">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
      </svg>

      <h1 class="text-5xl font-bold text-primary">404</h1>
      <h2 class="text-3xl font-semibold mt-2 text-base-content">Page Not Found</h2>
      <p class="py-6 text-gray-600">The page you're looking for doesn't exist or has been moved.</p>

      <button class="btn btn-primary bg-gradient-to-r from-pink-400 to-rose-400 border-0 text-white hover:from-pink-500 hover:to-rose-500"
        (click)="goBack()">
        Go Back
      </button>
    </div>
  </div>
</div>
