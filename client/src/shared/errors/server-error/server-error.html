<div class="hero min-h-screen bg-base-200">
  <div class="hero-content text-center w-full">
    <div class="w-full">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-24 h-24 mx-auto text-error">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>

      <h1 class="text-5xl font-bold text-error">500</h1>
      <h2 class="text-3xl font-semibold mt-2 text-base-content">Server Error</h2>
      <p class="py-6 text-gray-600">Something went wrong on our end. Please try again later.</p>

      <button (click)="detailsToggle()" class="btn btn-primary bg-gradient-to-r from-pink-400 to-rose-400 border-0 text-white hover:from-pink-500 hover:to-rose-500">
        Toggle Details
      </button>

      @if (showDetails && error) {
        <div class="mt-6 p-6 bg-base-300 rounded-lg text-left overflow-auto w-full max-h-96">
          <h3 class="font-bold text-error mb-2">Error Details:</h3>
          <pre class="text-sm text-base-content">{{ error.details }}</pre>
        </div>
      }
    </div>
  </div>
</div>
